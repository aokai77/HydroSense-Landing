<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HydroSense — Análisis e historial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/hydrosense-views.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <!-- Barra superior -->
  <header class="hs-topbar">
    <a href="../index.html#funcionalidades" class="hs-brand" aria-label="Volver al panel principal de HydroSense">
      <svg class="hs-logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/>
      </svg>
      <span>HydroSense</span>
    </a>
    <label class="hs-accessible-toggle" for="toggle-modo-accesible">
      <span>Modo Accesible</span>
      <input type="checkbox" id="toggle-modo-accesible" role="switch" aria-label="Activar modo accesible con texto ampliado y alto contraste" />
    </label>
  </header>

  <!-- Navegación entre pantallas -->
  <nav class="hs-subnav" aria-label="Navegación del panel">
    <a href="../index.html#funcionalidades" class="hs-nav-item" data-page="index.html">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>Inicio</span>
    </a>
    <a href="analisis.html" class="hs-nav-item active" data-page="analisis.html" aria-current="page">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
      </svg>
      <span>Análisis</span>
    </a>
    <a href="retos.html" class="hs-nav-item" data-page="retos.html">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
      </svg>
      <span>Retos</span>
    </a>
    <a href="proyeccion.html" class="hs-nav-item" data-page="proyeccion.html">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>
      </svg>
      <span>Proyección y ahorro</span>
    </a>
    <a href="consejos.html" class="hs-nav-item" data-page="consejos.html">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 18h6"/><path d="M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/>
      </svg>
      <span>Guías y consejos</span>
    </a>
    <a href="dispositivos.html" class="hs-nav-item" data-page="dispositivos.html">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6v6H9z"/><path d="M9 1v3"/><path d="M15 1v3"/><path d="M9 20v3"/><path d="M15 20v3"/><path d="M20 9h3"/><path d="M20 14h3"/><path d="M1 9h3"/><path d="M1 14h3"/>
      </svg>
      <span>Dispositivos</span>
    </a>
  </nav>

  <!-- Contenido principal -->
  <main class="hs-container">
    <h1 class="hs-page-title">Análisis e historial</h1>

    <!-- Selector de periodo -->
    <div class="hs-period-tabs" role="tablist">
      <button type="button" class="hs-tab-btn" data-period="hoy" role="tab" aria-selected="false">Hoy</button>
      <button type="button" class="hs-tab-btn active" data-period="semana" role="tab" aria-selected="true">Semana</button>
      <button type="button" class="hs-tab-btn" data-period="mes" role="tab" aria-selected="false">Mes</button>
    </div>

    <!-- Grid de 2 columnas -->
    <div class="hs-grid-2">
      <!-- Tarjeta izquierda: Gráfico comparativo -->
      <section class="hs-card">
        <div class="hs-card-header">
          <div>
            <h2 class="hs-card-title" id="chartTitle">Consumo semanal</h2>
            <p class="hs-card-subtitle" id="chartSubtitle">Litros por persona · 30 sep–6 oct</p>
          </div>
          <span class="hs-badge-trend" id="trendBadge">↘ -4.6%</span>
        </div>

        <div class="hs-chart-area" id="chartBarsContainer"></div>

        <div class="hs-chart-footer">
          <div class="hs-legend">
            <span class="hs-legend-item"><i class="dot current"></i> <span id="legendCurrent">Semana actual</span></span>
            <span class="hs-legend-item"><i class="dot previous"></i> <span id="legendPrevious">Semana pasada</span></span>
          </div>
          <span class="hs-total-liters" id="totalLitersLabel">553 L</span>
        </div>
      </section>

      <!-- Tarjeta derecha: Desglose por puntos de uso -->
      <section class="hs-card" id="desglose-consumo">
        <div class="hs-card-header">
          <h2 class="hs-card-title">Desglose por puntos de uso</h2>
          <button type="button" class="hs-info-btn" title="Distribución porcentual estimada por punto de consumo">i</button>
        </div>

        <div class="hs-breakdown-list" id="breakdownContainer"></div>
      </section>
    </div>
  </main>

  <!-- Toast de respuesta del asistente por voz -->
  <div id="voice-toast" class="hs-voice-toast" role="status" aria-live="polite" hidden></div>

  <!-- Botón flotante de Asistente por Voz -->
  <button id="btn-asistente-voz" class="hs-fab-voice" type="button" aria-label="Consultar consumo mediante comandos de voz" title="Asistente por voz">
    <span aria-hidden="true">🎤</span>
  </button>

  <script src="../js/hydrosense-views.js"></script>
</body>
</html>
